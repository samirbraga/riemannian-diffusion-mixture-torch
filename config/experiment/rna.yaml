# @package _global_

name      : rna
experiment: rna
torus_dim : 7
batch_size: 8192 
steps     : 200000

defaults:
  - /dataset: rna
  - /manifold: htori
  - /mix     : log
  - /modelf  : mlp
  - /modelb  : mlp

n: 7

modelf:
  out_dim      : ${eval:${torus_dim} * 2}
  act          : swish

modelb:
  out_dim      : ${eval:${torus_dim} * 2}
  act          : swish

splits      : [0.8, 0.1, 0.1]
ema_rate    : 0.999
eps         : 1.0e-3
use_pode    : True

val_freq    : 1000
plot_freq   : 10000

lr_sched    : False

best_val : True
patience : 20000

beta_schedule:
  beta_0: 1e-4
  beta_f: 5e-4

optim:
  lr: 2e-3